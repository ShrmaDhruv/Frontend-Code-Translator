<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <style>
    .done span { text-decoration: line-through; }
  </style>
</head>
<body>
  <div class="todo-list">
    <h2>My Todos</h2>
    <input id="new-todo" placeholder="What needs doing?" />
    <button id="add-btn">Add</button>
    <p id="empty-msg">No todos yet</p>
    <ul id="todo-items"></ul>
    <p><span id="remaining">0</span> remaining</p>
  </div>

  <script>
    let todos = []

    function addTodo() {
      const input = document.getElementById('new-todo')
      const text = input.value.trim()
      if (!text) return
      todos.push({ id: Date.now(), text: text, done: false })
      input.value = ''
      render()
    }

    function toggleTodo(id) {
      todos = todos.map(t => (t.id === id ? { ...t, done: !t.done } : t))
      render()
    }

    function removeTodo(id) {
      todos = todos.filter(t => t.id !== id)
      render()
    }

    function render() {
      const list = document.getElementById('todo-items')
      list.replaceChildren()

      todos.forEach(todo => {
        const li = document.createElement('li')
        if (todo.done) li.classList.add('done')

        const checkbox = document.createElement('input')
        checkbox.type = 'checkbox'
        checkbox.checked = todo.done
        checkbox.addEventListener('change', () => toggleTodo(todo.id))

        const span = document.createElement('span')
        span.textContent = todo.text

        const del = document.createElement('button')
        del.textContent = 'Delete'
        del.addEventListener('click', () => removeTodo(todo.id))

        li.append(checkbox, span, del)
        list.appendChild(li)
      })

      document.getElementById('empty-msg').hidden = todos.length > 0
      list.hidden = todos.length === 0
      document.getElementById('remaining').textContent = todos.filter(t => !t.done).length
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('add-btn').addEventListener('click', addTodo)
      render()
    })
  </script>
</body>
</html>
