<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counter</title>
</head>
<body>
  <div class="counter">
    <h2>Count: <span id="count">0</span></h2>
    <p id="parity">Even</p>
    <button onclick="decrement()">-</button>
    <button onclick="increment()">+</button>
    <button onclick="reset()">Reset</button>
  </div>

  <script>
    const INITIAL = 0
    const STEP = 1
    let count = INITIAL

    function render() {
      document.getElementById('count').textContent = count
      document.getElementById('parity').textContent = count % 2 === 0 ? 'Even' : 'Odd'
    }

    function increment() {
      count += STEP
      render()
    }

    function decrement() {
      count -= STEP
      render()
    }

    function reset() {
      count = INITIAL
      render()
    }

    document.addEventListener('DOMContentLoaded', render)
  </script>
</body>
</html>
