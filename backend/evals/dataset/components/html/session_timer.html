<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Timer</title>
</head>
<body>
  <div class="session-timer">
    <h2 id="label">Session</h2>
    <p class="time" id="time">00:00</p>
    <p class="warning" id="warning" hidden>Time's up!</p>
    <button onclick="reset()">Reset</button>
  </div>

  <script>
    const LIMIT = 60
    let seconds = 0
    let intervalId = null

    function formatTime(total) {
      const m = String(Math.floor(total / 60)).padStart(2, '0')
      const s = String(total % 60).padStart(2, '0')
      return m + ':' + s
    }

    function render() {
      document.getElementById('time').textContent = formatTime(seconds)
      document.getElementById('warning').hidden = seconds < LIMIT
    }

    function reset() {
      seconds = 0
      render()
    }

    document.addEventListener('DOMContentLoaded', () => {
      render()
      intervalId = setInterval(() => {
        seconds++
        render()
      }, 1000)
    })
  </script>
</body>
</html>
